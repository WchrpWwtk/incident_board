services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: incident_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend

    env_file:
      - .env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    depends_on:
      - backend

    ports:
      - "4173:4173"

volumes:
  postgres_data:
